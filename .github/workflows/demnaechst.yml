name: Demnächst aktualisieren
on:
  schedule:
    - cron: '30 4 * * *'   # täglich 04:30 UTC (06:30 Sommerzeit)
    - cron: '30 15 * * *'  # und nachmittags
  workflow_dispatch:
permissions:
  contents: write
jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Termine von TMDB holen
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: node tools/demnaechst-holen.mjs
      - name: Änderungen veröffentlichen
        run: |
          git config user.name "Kestrel Termine"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/demnaechst.json src/data/news-archiv.json
          git diff --cached --quiet || (git commit -m "Termine aktualisiert ($(date -u +%d.%m.%Y))" && git pull --rebase -q && git push)
